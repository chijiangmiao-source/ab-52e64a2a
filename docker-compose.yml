services:
  orbit:
    build:
      context: .
      dockerfile: Dockerfile
    image: orbit-rule-crdt:latest
    environment:
      PORT: "8080"
      STATIONS: "station-alpha,station-beta,station-gamma"
      DATA_DIR: /data
    ports:
      # host-side port is configurable: HOST_PORT=9090 docker compose up -d
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - orbit-data:/data
    restart: unless-stopped

  # Dedicated, always-fresh instance for the acceptance suite.
  orbit-verify:
    image: orbit-rule-crdt:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      STATIONS: "station-alpha,station-beta,station-gamma"
      DATA_DIR: /data
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2); assert json.load(r)['status']=='ok'"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Acceptance suite. Run:
  #   docker compose run --build --rm verify ; echo $?
  # It interleaves: image build (--build), in-container code tests, and
  # HTTP smoke against the health and business endpoints of a fresh
  # instance, then exits with a non-zero code if any expectation fails.
  verify:
    image: orbit-rule-crdt:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BASE_URL: "http://orbit-verify:8080"
    depends_on:
      orbit-verify:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        echo "== [1/3] code tests =="
        python -m unittest discover -s tests -v
        echo "== [2/3] health endpoint smoke =="
        python -c "import json,os,urllib.request; r=urllib.request.urlopen(os.environ['BASE_URL']+'/healthz',timeout=5); b=json.load(r); print(b); assert b['status']=='ok'"
        echo "== [3/3] rendezvous scenario over business API =="
        python scripts/verify_scenario.py

volumes:
  orbit-data:
